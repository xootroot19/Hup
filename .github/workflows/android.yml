name: Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Expo prebuild
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Generate signing key
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/release.jks" \
            -storepass "github-actions-demo" \
            -keypass "github-actions-demo" \
            -alias "release" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Carteira Demo, O=Demo, C=BR"

      - name: Sign APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass pass:github-actions-demo \
            --key-pass pass:github-actions-demo \
            --ks-key-alias release \
            --out app-release.apk \
            "$APK"

          "$APKSIGNER" verify --verbose app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app-release.apk
          if-no-files-found: error
